[project]
name = "vigil-simulator"
version = "0.1.0"
description = "Synthetic eCommerce transaction generator with injected fraud scenarios"
authors = [
    { name = "Gary Hou", email = "hguochen@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.4",
    "pyarrow>=26.0.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
