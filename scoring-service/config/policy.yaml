# Decision policy: maps a 0-1 risk score to a decision and a risk level.
# A decision applies when score >= its threshold.
version: 1

thresholds:
  step_up_3ds: 0.35
  review: 0.6
  block: 0.85

risk_levels:
  elevated: 0.35
  high: 0.6
  critical: 0.85

# Jev strategies (jev, jev_rules). Thresholds apply to Jev's is_fraud probability.
jev:
  thresholds:
    step_up_3ds: 0.35
    review: 0.6
    block: 0.9
  # Jev's recommended action only counts when at least this confident.
  min_action_confidence: 0.6
  # If Jev errors or times out: "rules" decides with rules alone,
  # "review" also sends the order to review at minimum.
  on_error: rules

# XGBoost baseline (xgboost strategy). Model probabilities are not calibrated to
# business rules, so the policy sets alert-rate budgets: the share of ALL orders
# at or above each action (cumulative), i.e. step-up / review / block capacity.
# `vigil-train` ships the probability cutoffs that produce these rates on its
# calibration window. Labels are not needed for this, so unreported fraud cannot
# distort it. Change these, then retrain.
xgboost:
  alert_rates:
    step_up_3ds: 0.03
    review: 0.02
    block: 0.01
