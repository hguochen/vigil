[project]
name = "vigil-ml"
version = "0.1.0"
description = "XGBoost baseline training and ONNX export"
authors = [
    { name = "Gary Hou", email = "hguochen@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "vigil-simulator",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
vigil-simulator = { workspace = true }
