[project]
name = "vigil-ml"
version = "0.1.0"
description = "XGBoost baseline training and ONNX export"
authors = [
    { name = "Gary Hou", email = "hguochen@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "onnx>=1.23.2",
    "onnxmltools>=1.16.0",
    "onnxruntime>=1.31.0",
    "scikit-learn>=1.9.1",
    "vigil-simulator",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
vigil-simulator = { workspace = true }
